<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>อุทยานใกล้ฉัน</title>
  <meta name="theme-color" content="#73dc4b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="อุทยานใกล้ฉัน" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #73dc4b;
      --primary-dark: #173c23;
      --primary-soft: #e0f8d6;
      --text: #13291c;
      --muted: #77847c;
      --border: #dde4de;
      --background: #eef2ee;
      --shadow: 0 16px 45px rgba(18, 51, 30, 0.18);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; margin: 0; font-family: "Noto Sans Thai", sans-serif; color: var(--text); background: #dfe5e0; }
    button, input, textarea { font: inherit; color: inherit; }

    .app { position: relative; width: 100%; max-width: 520px; height: 100dvh; min-height: 650px; margin: 0 auto; overflow: hidden; background: var(--background); box-shadow: 0 0 45px rgba(19, 41, 28, 0.16); }

    .header { position: absolute; inset: 0 0 auto 0; z-index: 1000; display: flex; align-items: center; justify-content: center; height: calc(72px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); background: rgba(255,255,255,.96); border-bottom: 1px solid rgba(221,228,222,.8); backdrop-filter: blur(16px); }
    .header h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
    .header-logo { position: absolute; left: 18px; display: grid; width: 40px; height: 40px; place-items: center; color: #fff; background: var(--primary); border-radius: 14px; box-shadow: 0 8px 18px rgba(115,220,75,.35); }
    .header-logo i { width: 22px; }

    #map { position: absolute; inset: 0; z-index: 1; background: #e7ece7; }
    .leaflet-control-zoom { display: none; }
    .leaflet-control-attribution { margin-bottom: calc(150px + env(safe-area-inset-bottom)) !important; padding: 3px 7px !important; font-size: 9px !important; border-radius: 8px 0 0; }

    .search-panel { position: absolute; top: calc(82px + env(safe-area-inset-top)); right: 14px; left: 14px; z-index: 900; }
    .search-box { display: flex; align-items: center; height: 54px; padding: 0 16px; background: rgba(255,255,255,.97); border: 1px solid rgba(221,228,222,.9); border-radius: 22px; box-shadow: 0 10px 28px rgba(27,57,37,.14); }
    .search-box i { flex: 0 0 auto; width: 22px; color: #8a978f; }
    .search-box input { width: 100%; margin-left: 12px; background: transparent; border: 0; outline: 0; font-size: 16px; }
    .filters { display: flex; gap: 8px; margin-top: 10px; padding: 0 1px 6px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-chip { flex: 0 0 auto; height: 40px; padding: 0 17px; font-size: 14px; font-weight: 700; white-space: nowrap; background: rgba(255,255,255,.96); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 6px 15px rgba(27,57,37,.09); cursor: pointer; }
    .filter-chip.active { color: #1a5424; background: var(--primary-soft); border-color: #bcefac; }

    .result-pill { position: absolute; top: calc(192px + env(safe-area-inset-top)); left: 50%; z-index: 800; display: flex; align-items: center; gap: 8px; padding: 9px 16px; color: #536158; font-size: 14px; background: rgba(255,255,255,.94); border: 1px solid rgba(221,228,222,.9); border-radius: 999px; box-shadow: 0 7px 20px rgba(27,57,37,.12); transform: translateX(-50%); white-space: nowrap; }
    .result-pill strong { color: var(--primary-dark); }
    .result-pill i { width: 16px; height: 16px; }

    .park-marker { display: grid; width: 40px; height: 40px; place-items: center; font-size: 20px; background: #148846; border: 3px solid #fff; border-radius: 50% 50% 50% 6px; box-shadow: 0 6px 14px rgba(35,49,38,.28); transform: rotate(-45deg); transition: transform .2s ease; }
    .park-marker span { transform: rotate(45deg); line-height: 1; }
    .park-marker.selected { background: #ff8a1f; transform: rotate(-45deg) scale(1.2); }
    .user-marker { width: 20px; height: 20px; background: #2688ff; border: 4px solid #fff; border-radius: 50%; box-shadow: 0 0 0 8px rgba(38,136,255,.19), 0 3px 12px rgba(0,0,0,.25); }

    .map-actions { position: absolute; right: 16px; bottom: calc(240px + env(safe-area-inset-bottom)); z-index: 850; display: flex; flex-direction: column; gap: 12px; }
    .circle-button { display: grid; width: 52px; height: 52px; padding: 0; place-items: center; background: #fff; border: 1px solid var(--border); border-radius: 50%; box-shadow: 0 8px 20px rgba(27,57,37,.16); cursor: pointer; }
    .circle-button i { width: 23px; }

    .strip { position: absolute; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); left: 0; z-index: 900; display: flex; gap: 10px; padding: 10px 14px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
    .strip::-webkit-scrollbar { display: none; }
    .strip.hidden { display: none; }
    .strip-item { flex: 0 0 72%; max-width: 280px; padding: 12px 14px; text-align: left; background: rgba(255,255,255,.97); border: 1px solid rgba(222,230,223,.95); border-radius: 20px; box-shadow: 0 8px 22px rgba(27,57,37,.16); cursor: pointer; scroll-snap-align: start; }
    .strip-item b { display: block; overflow: hidden; font-size: 15px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .strip-item small { color: var(--muted); font-size: 12px; font-weight: 600; }
    .strip-item .rank { display: inline-block; margin-right: 6px; padding: 1px 8px; color: #1a5424; font-size: 11px; font-weight: 800; background: var(--primary-soft); border-radius: 999px; }

    .detail-card { position: absolute; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); left: 12px; z-index: 1100; padding: 18px; max-height: calc(100dvh - 160px); overflow-y: auto; background: rgba(255,255,255,.98); border: 1px solid rgba(222,230,223,.95); border-radius: 28px; box-shadow: var(--shadow); transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .25s ease; }
    .detail-card.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .card-handle { width: 48px; height: 5px; margin: -6px auto 13px; background: #d6ddd7; border-radius: 99px; }
    .card-top { display: flex; align-items: flex-start; gap: 13px; }
    .place-icon { display: grid; flex: 0 0 auto; width: 56px; height: 56px; place-items: center; color: #174426; background: var(--primary); border-radius: 18px; }
    .place-icon i { width: 29px; height: 29px; }
    .place-heading { min-width: 0; flex: 1; }
    .place-heading h2 { margin: 1px 0 3px; font-size: 19px; font-weight: 800; line-height: 1.35; }
    .place-heading p:empty { display: none; }
    .place-heading p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .close-button { display: grid; flex: 0 0 auto; width: 38px; height: 38px; padding: 0; place-items: center; color: #5f6d64; background: #f6f8f6; border: 1px solid var(--border); border-radius: 50%; cursor: pointer; }
    .close-button i { width: 19px; }
    .nearest-tag { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 8px; padding: 4px 11px; color: #16753a; font-size: 12px; font-weight: 800; background: #e2f7dc; border-radius: 999px; }
    .nearest-tag i { width: 14px; height: 14px; }
    .nearest-tag.hidden { display: none; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .fact { min-width: 0; padding: 10px 6px; text-align: center; background: #f3f6f3; border-radius: 16px; }
    .fact i { width: 19px; height: 19px; color: #2b7a3c; }
    .fact strong { display: block; margin-top: 4px; font-size: 13px; line-height: 1.3; }
    .fact span { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

    .park-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
    .primary-actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    .large-button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; font-size: 15px; font-weight: 800; background: #fff; border: 1px solid #d6ded7; border-radius: 18px; cursor: pointer; }
    .large-button.primary { color: #153c21; background: var(--primary); border-color: var(--primary); box-shadow: 0 9px 20px rgba(115,220,75,.25); }
    .large-button i { width: 20px; }

    .review-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .review-item { font-size: 13px; margin-bottom: 10px; background: #f9faf9; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--border); }
    .review-item .stars { color: #fbbf24; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 20px; border-radius: 24px; box-shadow: var(--shadow); }
    .modal-box h3 { margin: 0 0 12px; font-size: 18px; }
    .star-select { font-size: 32px; color: #d1d5db; text-align: center; cursor: pointer; margin-bottom: 12px; }
    .star-select span.active { color: #fbbf24; }
    .modal-box textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid var(--border); border-radius: 14px; resize: none; outline: none; margin-bottom: 12px; }

    .toast { position: absolute; bottom: calc(190px + env(safe-area-inset-bottom)); left: 50%; z-index: 1500; max-width: calc(100% - 34px); padding: 12px 17px; color: #fff; font-size: 13px; font-weight: 700; text-align: center; background: rgba(19,41,28,.93); border-radius: 14px; box-shadow: 0 10px 24px rgba(19,41,28,.24); transform: translate(-50%, 25px); opacity: 0; pointer-events: none; transition: .25s ease; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .sheet-backdrop { position: absolute; inset: 0; z-index: 2000; display: none; align-items: flex-end; background: rgba(19,41,28,.45); }
    .sheet-backdrop.show { display: flex; }
    .sheet { width: 100%; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); background: #fff; border-radius: 28px 28px 0 0; }
    .sheet h3 { margin: 0 0 12px; font-size: 18px; font-weight: 800; }
    .sheet ol { margin: 0 0 16px; padding-left: 22px; font-size: 15px; line-height: 1.9; }
    .sheet .large-button { width: 100%; }

    .bottom-nav { position: absolute; inset: auto 0 0 0; z-index: 1000; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 6px env(safe-area-inset-bottom); background: rgba(255,255,255,.97); border-top: 1px solid var(--border); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: #859188; font-size: 11px; font-weight: 700; background: none; border: 0; cursor: pointer; }
    .nav-item i { width: 24px; height: 24px; }
    .nav-item.active { color: #28772d; }
    .page { position: absolute; inset: calc(72px + env(safe-area-inset-top)) 0 calc(60px + env(safe-area-inset-bottom)) 0; z-index: 950; display: none; padding: 16px 16px 24px; overflow-y: auto; background: var(--background); }
    .page.show { display: block; }
    .page h2 { margin: 0 0 14px; font-size: 20px; font-weight: 800; }
    .card { padding: 16px; margin-bottom: 12px; background: #fff; border: 1px solid var(--border); border-radius: 22px; }
    .profile { display: flex; align-items: center; gap: 14px; }
    .avatar { flex: 0 0 auto; width: 34px; height: 34px; object-fit: cover; color: #174426; font-weight: 800; text-align: center; line-height: 34px; background: var(--primary); border-radius: 50%; }
    .avatar.lg { width: 64px; height: 64px; line-height: 64px; font-size: 24px; }
    .bar { height: 10px; margin-top: 12px; overflow: hidden; background: #e7ece7; border-radius: 99px; }
    .bar > div { height: 100%; background: var(--primary); }
    .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eef2ee; font-size: 14px; }
    .row:last-child { border: 0; }
    .row .grow { flex: 1; min-width: 0; overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .row small { color: var(--muted); font-weight: 600; }
    .row.me { background: var(--primary-soft); margin: 0 -8px; padding: 10px 8px; border-radius: 12px; }
    .medal { width: 28px; font-size: 20px; text-align: center; font-weight: 800; }
    .who { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .who .chip { display: flex; align-items: center; gap: 5px; padding: 2px 10px 2px 2px; color: var(--text); background: #f3f6f3; border-radius: 99px; }
    .who .chip .avatar { width: 22px; height: 22px; line-height: 22px; font-size: 11px; }
    .large-button.checkin { width: 100%; margin-top: 12px; }
    .large-button:disabled { opacity: .55; }
    .btn-delete-sm { background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 700; }
    @media (max-height: 760px) { .detail-card { padding: 14px; } .facts { margin-top: 10px; } }
    @media (min-width: 700px) { body { padding: 18px 0; } .app { height: calc(100dvh - 36px); border-radius: 30px; } }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="header-logo"><i data-lucide="trees"></i></div>
      <h1>อุทยานใกล้ฉัน</h1>
    </header>

    <section class="search-panel">
      <label class="search-box">
        <i data-lucide="search"></i>
        <input id="searchInput" type="search" placeholder="ค้นหาอุทยานแห่งชาติ" />
      </label>
      <div class="filters">
        <button class="filter-chip active" data-km="0">ทั้งหมด</button>
        <button class="filter-chip" data-km="50">ใน 50 กม.</button>
        <button class="filter-chip" data-km="100">ใน 100 กม.</button>
        <button class="filter-chip" data-km="200">ใน 200 กม.</button>
        <button class="filter-chip" data-km="500">ใน 500 กม.</button>
      </div>
    </section>

    <div class="result-pill">
      <i data-lucide="map-pin"></i>
      พบอุทยาน <strong id="resultCount">0</strong> แห่ง
    </div>

    <div id="map"></div>

    <div class="map-actions">
      <button class="circle-button" id="installButton" aria-label="บันทึกไอคอนไว้หน้าจอมือถือ"><i data-lucide="download"></i></button>
      <button class="circle-button" id="locateButton" aria-label="ตำแหน่งของฉัน"><i data-lucide="locate-fixed"></i></button>
    </div>

    <div class="strip" id="strip"></div>

    <article class="detail-card" id="detailCard">
      <div class="card-handle"></div>
      <div class="card-top">
        <div class="place-icon"><i data-lucide="trees"></i></div>
        <div class="place-heading">
          <span class="nearest-tag" id="nearestTag"><i data-lucide="sparkles"></i>อุทยานที่ใกล้คุณที่สุด</span>
          <h2 id="placeName">-</h2>
          <p id="placeDesc"></p>
        </div>
        <button class="close-button" id="closeCard" aria-label="ปิด"><i data-lucide="x"></i></button>
      </div>

      <div class="facts">
        <div class="fact"><i data-lucide="route"></i><strong id="placeDistance">-</strong><span>ระยะทางจากคุณ</span></div>
        <div class="fact"><i data-lucide="car"></i><strong id="placeDrive">-</strong><span>ขับรถโดยประมาณ</span></div>
        <div class="fact"><i data-lucide="map-pin"></i><strong id="placeCoord">-</strong><span>พิกัด</span></div>
      </div>

      <div class="who" id="who"></div>
      
      <button class="large-button primary checkin" id="checkinButton"><i data-lucide="circle-check"></i>เช็กอินที่นี่</button>

      <div class="park-actions">
        <button class="large-button" id="reviewBtn"><i data-lucide="star"></i>รีวิวสถานที่</button>
        <button class="large-button" id="shareButton"><i data-lucide="share-2"></i>แชร์ประสบการณ์</button>
      </div>

      <div class="primary-actions">
        <button class="large-button primary" id="navigateButton"><i data-lucide="navigation"></i>นำทาง</button>
      </div>

      <div class="review-section" id="reviewSection">
        <div style="font-weight:700; margin-bottom:6px; font-size:14px;">ความคิดเห็นและรีวิว</div>
        <div id="reviewList" style="max-height:180px; overflow-y:auto;"></div>
      </div>
    </article>

    <!-- Modal เขียนรีวิว พร้อมอัปโหลดรูปภาพ -->
    <div class="modal-overlay" id="reviewModal">
      <div class="modal-box">
        <h3>รีวิวอุทยาน</h3>
        <div class="star-select" id="starSelect">
          <span data-v="1" class="active">★</span>
          <span data-v="2" class="active">★</span>
          <span data-v="3" class="active">★</span>
          <span data-v="4" class="active">★</span>
          <span data-v="5" class="active">★</span>
        </div>
        <textarea id="reviewComment" placeholder="เล่าความประทับใจ เช่น ธรรมชาติสวยงาม ห้องน้ำสะอาด"></textarea>
        
        <div style="margin-bottom: 14px;">
          <label style="font-size: 13px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 6px;">แนบรูปภาพประกอบ (สูงสุด 3 รูป)</label>
          <input type="file" id="reviewFileinput" accept="image/*" multiple style="width: 100%; font-size: 12px; padding: 6px; background: #f3f6f3; border-radius: 8px; border: 1px solid var(--border);" />
          <div id="imagePreviewContainer" style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;"></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button class="large-button" id="cancelReview">ยกเลิก</button>
          <button class="large-button primary" id="submitReview">บันทึกรีวิว</button>
        </div>
      </div>
    </div>

    <section class="page" id="pageMe"></section>
    <section class="page" id="pageBoard"></section>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="map"><i data-lucide="map"></i>แผนที่</button>
      <button class="nav-item" data-tab="me"><i data-lucide="user-round"></i>สมาชิก</button>
      <button class="nav-item" data-tab="board"><i data-lucide="trophy"></i>Leader</button>
    </nav>

    <div class="sheet-backdrop" id="sheet">
      <div class="sheet">
        <h3>บันทึกไอคอนไว้หน้าจอมือถือ</h3>
        <ol id="sheetSteps"></ol>
        <button class="large-button primary" id="sheetClose">เข้าใจแล้ว</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    async function loadData() {

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371, rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }
    const fmtKm = km => km < 1 ? `${Math.round(km * 1000)} ม.` : `${km.toFixed(km < 10 ? 1 : 0)} กม.`;
    function fmtDrive(km) {
      const min = Math.round(km * 1.4 / 60 * 60);
      return min < 60 ? `${min} นาที` : `${Math.floor(min / 60)} ชม. ${min % 60} นาที`;
    }

    function markerIcon(sel) {
      return L.divIcon({ className: "", html: `<div class="park-marker${sel ? " selected" : ""}"><span>🌲</span></div>`, iconSize: [40, 40], iconAnchor: [20, 38] });
    }

    function visibleParks() {
      const kw = searchInput.value.trim().toLowerCase();
      return parks.filter(p =>
        (!kw || p.name.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw)) &&
        (!maxKm || !userPos || p.dist <= maxKm)
      );
    }

    function render() {
      if (userPos) parks.forEach(p => p.dist = haversine(userPos.lat, userPos.lng, p.lat, p.lng));
      parks.sort((a, b) => userPos ? a.dist - b.dist : a.name.localeCompare(b.name, "th"));
      const list = visibleParks();
      $("resultCount").textContent = list.length;

      markerLayer.clearLayers();
      markers.clear();
      list.forEach(p => {
        const m = L.marker([p.lat, p.lng], { icon: markerIcon(selected === p) }).on("click", () => selectPark(p));
        m.addTo(markerLayer);
        markers.set(p, m);
      });

      strip.innerHTML = "";
      list.slice(0, 12).forEach((p, i) => {
        const b = document.createElement("button");
        b.className = "strip-item";
        b.innerHTML = `<b>${i === 0 && userPos ? '<span class="rank">ใกล้สุด</span>' : ""}${p.name}</b><small>${userPos ? fmtKm(p.dist) + " · ขับประมาณ " + fmtDrive(p.dist) : "แตะเพื่อดูรายละเอียด"}</small>`;
        b.onclick = () => selectPark(p);
        strip.appendChild(b);
      });
      strip.classList.toggle("hidden", detailCard.classList.contains("open"));
    }

    async function selectPark(p, fit = false) {
      selected = p;
      markers.forEach((m, park) => m.setIcon(markerIcon(park === p)));
      $("placeName").textContent = p.name;

      $("placeDistance").textContent = userPos ? fmtKm(p.dist) : "-";
      $("placeDrive").textContent = userPos ? fmtDrive(p.dist) : "-";

      renderWho(p);

      detailCard.classList.add("open");
      strip.classList.add("hidden");

      const url = new URL(window.location);
      url.searchParams.set('park', p.id);
      window.history.replaceState({}, '', url);

      if (fit && userPos) map.fitBounds([[userPos.lat, userPos.lng], [p.lat, p.lng]], { padding: [70, 70], maxZoom: 14, paddingBottomRight: [70, 300] });
      else map.panTo([p.lat, p.lng], { animate: true });
    }

    function locate(auto = false) {
      if (!navigator.geolocation) { showToast("อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง"); render(); return; }
      if (!auto) showToast("กำลังค้นหาตำแหน่งของคุณ");

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([userPos.lat, userPos.lng], { icon: L.divIcon({ className: "", html: '<div class="user-marker"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }), zIndexOffset: 1000 }).addTo(map);

    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
        };
      });
    }

    async function loadReviews(parkId) {
      const listEl = $("reviewList");
      listEl.innerHTML = "<small style='color:var(--muted)'>กำลังโหลดรีวิว...</small>";
      try {
        const j = await api("get_reviews", { parkId });

          listEl.innerHTML = "<small style='color:var(--muted)'>ยังไม่มีรีวิว มาเป็นคนแรกกัน!</small>";
          return;
        }
        listEl.innerHTML = j.reviews.map(r => {
          let imgHtml = "";
          if (r.images && r.images.length > 0) {
            imgHtml = `<div style="display:flex; gap:6px; margin-top:8px;">` + 
              r.images.map(img => `<img src="${img}" style="width:50px; height:50px; object-fit:cover; border-radius:6px; border:1px solid var(--border);" />`).join("") +
              `</div>`;

          // แปลงรูปแรกเป็น string สำหรับส่งแชร์ (ถ้ามี)
          const firstImg = (r.images && r.images.length > 0) ? r.images[0] : "";
          return `

                <b>${esc(r.name)}</b>

              </div>
            </div>
          `;
        }).join("");
      } catch (e) {
        listEl.innerHTML = `<small style='color:#dc2626'>โหลดรีวิวไม่สำเร็จ (${esc(e.message)})</small>`;
      }
    }

    function shareReview(name, rating, comment, parkName, parkId) {
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?park=${parkId}`;
      const text = `⭐ รีวิวอุทยาน ${parkName} โดยคุณ ${name}\nคะแนน: ${"★".repeat(rating)}${"☆".repeat(5 - rating)}\n"${comment}"\n\nคลิกดูสถานที่:\n${shareUrl}`;
      if (navigator.share) {
        navigator.share({ title: `รีวิว ${parkName}`, text: text, url: shareUrl }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text);
        showToast("คัดลอกลิงก์รีวิวเรียบร้อยแล้ว!");
      }
    }

        deferredPrompt = null;
      } else if (isIOS) {
        showSheet(["เปิดหน้านี้ด้วย <b>Safari</b>", "แตะปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรขึ้น)", "เลือก <b>เพิ่มไปยังหน้าจอโฮม</b>"]);
      } else {
        showSheet(["เปิดหน้านี้ด้วย <b>Chrome</b>", "แตะเมนู <b>⋮</b> มุมขวาบน", "เลือก <b>เพิ่มไปยังหน้าจอหลัก</b>"]);
      }
    });

    $("navigateButton").addEventListener("click", () => {
      if (selected) window.open(`https://www.google.com/maps/dir/?api=1&destination=${selected.lat},${selected.lng}`, "_blank");
    });
    
    $("shareButton").addEventListener("click", async () => {
      if (!selected) return;
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?park=${selected.id}`;
      const data = { title: selected.name, text: `มาเที่ยวอุทยาน ${selected.name} กันเถอะ!`, url: shareUrl };
      try {
        if (navigator.share) await navigator.share(data);
        else { await navigator.clipboard.writeText(shareUrl); showToast("คัดลอกลิงก์สถานที่แล้ว"); }
      } catch (e) {}
    });

    let me = null, checkins = [], boardMode = "total", lastFetch = 0, loading = false;
    try { checkins = JSON.parse(localStorage.getItem("pk_checkins")) || []; } catch (e) {}
    const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const avatar = (u, cls = "") => /^https:\/\//.test(u.pic || "") ? `<img class="avatar ${cls}" loading="lazy" src="${esc(u.pic)}" alt="">` : `<div class="avatar ${cls}">${esc((u.name || "?")[0])}</div>`;
    const fmtDate = ts => new Date(ts).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" });

    async function api(action, payload = {}, auth = false) {
      if (!CONFIG.API_URL) throw new Error("ยังไม่ได้ตั้งค่า API_URL");
      const body = { action, ...payload };
      if (auth) body.token = me && me.token;
      const r = await fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(body) });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      return j;
    }

    const SKEY = "pk_session";
    const saveSession = v => { try { localStorage.setItem(SKEY, JSON.stringify(v)); } catch (e) {} };
    const clearSession = () => { try { localStorage.removeItem(SKEY); } catch (e) {} me = null; };
    
    async function initLine() {
      try { 
        const sv = JSON.parse(localStorage.getItem(SKEY)); 
        if (sv && sv.token) me = sv; 
      } catch (e) {}

      if (!CONFIG.LIFF_ID || !window.liff) return;
      
      try {
        await liff.init({ liffId: CONFIG.LIFF_ID });
        if (liff.isLoggedIn()) {
          const idToken = liff.getIDToken();
          if (idToken) {
            const j = await api("login", { idToken: idToken });
            if (!j.error) {
              me = { token: j.token, id: j.uid, name: j.name, pic: j.pic };
              saveSession(me);
            }
          }
        }
      } catch (e) {}
    }

    function login() { 
      if (window.liff && liff.isInClient()) {
        liff.login();
      } else {
        liff.login({ redirectUri: location.href }); 
      }
    }

    function refreshViews() { if (selected) renderWho(selected); renderMe(); renderBoard(); }
    async function loadCheckins(force = true) {
      if (loading || (!force && Date.now() - lastFetch < 20000)) return;
      loading = true; refreshViews();
      try {
        const j = await api("list");
        checkins = j.r.map(([uid, parkId, ts, parkName]) => ({ uid, parkId, ts, parkName, name: j.u[uid]?.[0] || "สมาชิก", pic: j.u[uid]?.[1] || "" }));
        lastFetch = Date.now();
        try { localStorage.setItem("pk_checkins", JSON.stringify(checkins)); } catch (e) {}
      } catch (e) {}
      loading = false; refreshViews();
    }

    const dayTH = d => new Date(d).toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
    function renderWho(p) {
      const done = !!me && checkins.some(c => c.uid === me.id && Number(c.parkId) === p.id && dayTH(c.ts) === dayTH(Date.now()));
      const btn = $("checkinButton");
      btn.disabled = done;
      btn.lastChild.textContent = done ? "เช็กอินแล้ววันนี้ ✓" : "เช็กอินที่นี่";
      const m = new Map();
      checkins.filter(c => Number(c.parkId) === p.id).forEach(c => { if (!m.has(c.uid)) m.set(c.uid, c); });
      const users = [...m.values()];
      $("who").innerHTML = users.length
        ? `<div style="width:100%">เช็กอินแล้ว ${users.length} คน</div>` + users.slice(0, 10).map(u => `<span class="chip">${avatar(u)}${esc(u.name)}</span>`).join("") + (users.length > 10 ? `<span class="chip">+${users.length - 10}</span>` : "")
        : (loading ? "กำลังโหลดรายชื่อ…" : "ยังไม่มีใครเช็กอินที่นี่ — เป็นคนแรกเลย!");
    }

    $("checkinButton").addEventListener("click", async () => {
      if (!me) return login();
      $("checkinButton").disabled = true;
      try {
        await api("checkin", { parkId: selected.id, parkName: selected.name, lat: userPos?.lat, lng: userPos?.lng, plat: selected.lat, plng: selected.lng }, true);
        showToast("เช็กอินสำเร็จ 🌲");
        await loadCheckins();
      } catch (e) { showToast(e.message); if (/เซสชัน/.test(e.message)) { clearSession(); renderMe(); } }
      renderWho(selected);
    });

    async function deleteCheckin(parkId) {
      if (!confirm("คุณต้องการลบประวัติการเช็กอินอุทยานนี้ใช่หรือไม่?")) return;
      try {
        await api("delete_checkin", { parkId }, true);
        showToast("ลบจุดเช็กอินสำเร็จ");
        await loadCheckins();
      } catch (e) { showToast(e.message); }
    }

    function renderMe() {
      const el = $("pageMe");
      if (!me) {
        el.innerHTML = '<h2>สมาชิก</h2><div class="card" style="text-align:center"><p>เข้าสู่ระบบด้วย LINE เพื่อเช็กอินและดูสถิติของคุณ</p><button class="large-button primary" style="width:100%" id="loginBtn">เข้าสู่ระบบด้วย LINE</button>' +
          '<p style="margin:16px 0 6px;font-size:13px;color:var(--muted)">หรือวางรหัสเข้าสู่ระบบ</p>' +
          '<input id="codeInput" placeholder="วางรหัสที่นี่" style="width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:14px"><button class="large-button" style="width:100%;margin-top:8px" id="codeBtn">ใช้รหัส</button></div>';
        $("loginBtn").onclick = login;
        $("codeBtn").onclick = async () => { try { const t = $("codeInput").value.trim(), j = await api("me", { token: t }); me = { token: t, id: j.uid, name: j.name, pic: j.pic }; saveSession(me); renderMe(); loadCheckins(); } catch (e) { showToast(e.message); } };
        return;
      }
      const mine = checkins.filter(c => c.uid === me.id), per = new Map();
      mine.forEach(c => { const o = per.get(Number(c.parkId)) || { n: 0, last: c.ts, parkName: c.parkName }; o.n++; if (c.ts > o.last) o.last = c.ts; per.set(Number(c.parkId), o); });
      const pct = Math.round(per.size / parks.length * 100);
      const list = [...per.entries()].sort((a, b) => b[1].last.localeCompare(a[1].last));
      
      let listHtml = "";
      if (list.length > 0) {
        listHtml = list.map(([id, o]) => {
          const displayName = o.parkName || parks[id]?.name || "อุทยานแห่งชาติ";
          return '<div class="row"><span class="grow">' + esc(displayName) + '</span><small>' + fmtDate(o.last) + '</small><button class="btn-delete-sm" onclick="deleteCheckin(' + id + ')">ลบ</button></div>';
        }).join("");
      } else {
        listHtml = '<p style="color:var(--muted)">' + (loading ? "กำลังโหลด…" : "ยังไม่เคยเช็กอิน") + '</p>';
      }

      el.innerHTML = '<h2>สมาชิก</h2>' +
        '<div class="card"><div class="profile">' + avatar(me, "lg") + '<div><b style="font-size:18px">' + esc(me.name) + '</b><br><small style="color:var(--muted)">นักสำรวจอุทยาน</small></div></div>' +
        '<div class="facts"><div class="fact"><strong>' + per.size + '</strong><span>อุทยานที่เคยไป</span></div><div class="fact"><strong>' + mine.length + '</strong><span>เช็กอินทั้งหมด</span></div><div class="fact"><strong>' + pct + '%</strong><span>จาก ' + parks.length + ' แห่ง</span></div></div>' +
        '<div class="bar"><div style="width:' + pct + '%"></div></div></div>' +
        '<div class="card"><b>อุทยานที่ไปมาแล้ว</b>' + listHtml + '</div>' +
        '<button class="large-button" style="width:100%;margin-bottom:10px" id="copyBtn">คัดลอกรหัสเข้าสู่ระบบ</button>' +
        '<button class="large-button" style="width:100%" id="logoutBtn">ออกจากระบบ</button>';
      
      $("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(me.token); showToast("คัดลอกรหัสแล้ว"); } catch (e) {} };
      $("logoutBtn").onclick = () => { clearSession(); try { if (window.liff && liff.isLoggedIn()) liff.logout(); } catch (e) {} location.reload(); };
    }

    function renderBoard() {
      const m = new Map();
      checkins.forEach(c => { const u = m.get(c.uid) || { uid: c.uid, name: c.name, pic: c.pic, total: 0, set: new Set() }; u.total++; u.set.add(Number(c.parkId)); u.name = c.name; u.pic = c.pic; m.set(c.uid, u); });
      const key = u => boardMode === "total" ? u.total : u.set.size;
      const rank = [...m.values()].sort((a, b) => key(b) - key(a) || b.set.size - a.set.size).slice(0, 50);
      const medals = ["🥇", "🥈", "🥉"];
      $("pageBoard").innerHTML = `<h2>Leader</h2>
        <div class="filters"><button class="filter-chip ${boardMode === "total" ? "active" : ""}" data-m="total">เช็กอินมากสุด</button><button class="filter-chip ${boardMode === "parks" ? "active" : ""}" data-m="parks">ไปหลายอุทยานสุด</button></div>
        <div class="card">${rank.length ? rank.map((u, i) => `<div class="row ${me && u.uid === me.id ? "me" : ""}"><span class="medal">${medals[i] || i + 1}</span>${avatar(u)}<span class="grow">${esc(u.name)}</span><small>${u.total} ครั้ง · ${u.set.size} แห่ง</small></div>`).join("") : `<p style="color:var(--muted)">${loading ? "กำลังโหลด…" : "ยังไม่มีข้อมูลเช็กอิน"}</p>`}</div>`;
      document.querySelectorAll("#pageBoard .filter-chip").forEach(b => b.onclick = () => { boardMode = b.dataset.m; renderBoard(); });
    }

    document.querySelectorAll(".nav-item").forEach(b => b.addEventListener("click", () => {
      const t = b.dataset.tab;
      document.querySelectorAll(".nav-item").forEach(x => x.classList.toggle("active", x === b));
      $("pageMe").classList.toggle("show", t === "me");
      $("pageBoard").classList.toggle("show", t === "board");
      if (t !== "map") { detailCard.classList.remove("open"); selected = null; }
      else { render(); setTimeout(() => map.invalidateSize(), 50); }
      if (t !== "map") loadCheckins(false);
    }));

    loadData().then(() => {
      render(); 
      locate(true);
      
      initLine().then(() => { 
        renderMe(); 
        if (selected) renderWho(selected); 
      });
      
      renderBoard();
      loadCheckins();

      // ตรวจสอบพารามิเตอร์ลิงก์ ?park= เพื่อเปิดไปยังสถานที่ที่แชร์มาทันที
      const urlParams = new URLSearchParams(window.location.search);
      const parkParam = urlParams.get('park');
      if (parkParam !== null && parks[Number(parkParam)]) {
        setTimeout(() => {
          selectPark(parks[Number(parkParam)], true);
        }, 400);
      }
    });
  </script>
</body>
</html>
